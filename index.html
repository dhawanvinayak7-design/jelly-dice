<style>
  :root{
    --bg1:#fbf8fa; --bg2:#f4eef2;
    --ink:#3a1f2f; --mauve:#8c6a7c; --line:#d9c4cd;
    --plum:#6a2d48; --plum-deep:#5a2039;
    --serif:"Instrument Serif","Playfair Display",Georgia,"Times New Roman",serif;
    --sans:"Inter","SF Pro Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:var(--sans);color:var(--ink);
    background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);
    overflow:hidden;-webkit-user-select:none;user-select:none;
  }
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}

  .brand{
    position:fixed;top:26px;left:40px;margin:0;pointer-events:none;z-index:2;
    font-family:var(--serif);font-weight:400;line-height:.86;letter-spacing:-.02em;
    font-size:clamp(40px,6.4vw,92px);
  }
  .brand span,.brand em{display:block}
  .brand em{font-style:italic}

  /* Top-right: the title already owns the left, the tray owns the center */
  .credits{
    position:fixed;top:28px;right:40px;z-index:10;
    display:flex;flex-direction:column;align-items:flex-end;gap:4px;
  }
  .tm,.author{
    text-decoration:none;color:var(--mauve);
    font-size:14px;font-weight:400;line-height:1.3;
    transition:opacity .15s;
  }
  .tm{display:flex;align-items:center;gap:6px}
  .tm:hover,.author:hover{opacity:.7}
  .tm img{width:14px;height:14px;border-radius:3px;display:block}

  .label{
    font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;
    color:var(--mauve);margin:0;
  }
  .label.strong{color:var(--ink);font-weight:600;font-size:10px;letter-spacing:.16em}

  .bar{
    position:fixed;left:0;right:0;bottom:0;
    padding:0 40px calc(28px + env(safe-area-inset-bottom));
    display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:16px;
    pointer-events:none;
  }
  .flavor{display:flex;flex-direction:column;align-items:flex-start;gap:10px;justify-self:start;padding-bottom:8px;pointer-events:auto}
  .swatches{display:flex;gap:8px}
  .swatches button{
    appearance:none;border:0;background:none;padding:2px;margin:0;cursor:pointer;border-radius:50%;display:block;
  }
  .swatches button[aria-pressed="false"] .swatch{opacity:.45;filter:saturate(.6);transform:scale(.88)}
  .swatches button[aria-pressed="true"] .swatch{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--plum),inset 0 -3px 6px rgba(60,20,40,.3)}
  .swatches button:hover .swatch{opacity:1;transform:scale(1)}
  .swatches button:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
  .swatch{
    width:28px;height:28px;border-radius:50%;flex:none;display:block;
    transition:opacity .15s,filter .15s,transform .15s,box-shadow .15s;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),inset 0 -3px 6px rgba(60,20,40,.3),0 3px 10px rgba(60,20,40,.15);
  }
  .swatch.raspberry{background:radial-gradient(circle at 36% 30%,#ffb8ea 0%,#ee3fbb 40%,#b8128a 72%,#6e0748 100%)}
  .swatch.blueberry{background:radial-gradient(circle at 36% 30%,#b9a9ff 0%,#5a3cf0 40%,#2b12b0 72%,#10053f 100%)}
  .swatch.apple{background:radial-gradient(circle at 36% 30%,#ffb3b3 0%,#e8151f 38%,#a40008 70%,#3a0005 100%)}
  .swatch.strawberry{background:radial-gradient(circle at 36% 30%,#fbd7e6 0%,#ec8ec0 38%,#d55d97 68%,#b8477c 100%)}
  .swatch.lime{
    background:radial-gradient(circle at 36% 30%,#e4ff9a 0%,#a8e83e 40%,#6cbb1a 70%,#4a8f10 100%);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),inset 0 -3px 6px rgba(40,90,10,.35),0 3px 10px rgba(40,90,10,.18);
  }
  .swatch.cherry{
    background:
      radial-gradient(circle at 46% 44%,#ffffff 0 5%,transparent 6%),
      radial-gradient(circle at 56% 58%,#8c0a1e 0 24%,transparent 26%),
      radial-gradient(circle at 36% 30%,#ffffff 0%,#f1eef0 45%,#d9d2d6 100%);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.8),inset 0 -3px 6px rgba(80,60,70,.25),0 3px 10px rgba(80,60,70,.15);
  }

  .tally{justify-self:end;text-align:left}
  .tally .label{margin-bottom:12px}
  .faces{display:flex;align-items:center;gap:8px}
  .face{
    width:34px;height:34px;border:1.5px solid var(--line);border-radius:8px;
    display:grid;place-items:center;font-size:15px;color:var(--ink);background:rgba(255,255,255,.35);
  }
  .face.wait{font-size:16px}
  .eq{font-size:16px;color:var(--mauve);margin:0 4px}
  .total{font-family:var(--serif);font-size:40px;line-height:1;color:var(--ink);margin-top:-4px;min-width:1ch}
  .total.wait{font-family:var(--sans);font-size:20px;letter-spacing:.12em;margin-top:0}

  .controls{display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:auto}
  .count{display:flex;gap:6px}
  .count button{
    appearance:none;border:1.5px solid var(--line);background:rgba(255,255,255,.35);color:var(--mauve);
    width:28px;height:28px;border-radius:7px;font:inherit;font-size:12px;cursor:pointer;
  }
  .count button[aria-pressed="true"]{border-color:var(--plum);color:var(--plum);background:#fff}
  .count button:focus-visible,#roll:focus-visible{outline:3px solid var(--plum);outline-offset:3px}
  #roll{
    appearance:none;border:0;cursor:pointer;font:inherit;font-weight:500;font-size:15px;
    color:#fff;background:var(--plum);border-radius:999px;height:46px;padding:0 22px;
    display:flex;align-items:center;gap:16px;
    box-shadow:0 8px 20px rgba(106,45,72,.26);
    transition:transform .12s,background .15s;
  }
  #roll svg{width:18px;height:18px;flex:none}
  #roll:hover{background:var(--plum-deep)}
  #roll:active{transform:translateY(2px) scale(.985)}
  .hint{font-size:11px;letter-spacing:.06em;color:var(--mauve);margin:0}

  /* Phones: title smaller, bottom bar stacks in three rows */
  @media (max-width:760px), (max-height:520px){
    .brand{left:18px;top:14px;font-size:clamp(34px,10vw,56px)}
    .credits{top:16px;right:16px;gap:3px}
    .tm,.author{font-size:14px}
    .tm{gap:5px}
    .tm img{width:12px;height:12px;border-radius:3px}
    .bar{
      grid-template-columns:1fr;padding:0 16px calc(14px + env(safe-area-inset-bottom));gap:12px;
      background:linear-gradient(180deg,rgba(244,238,242,0) 0%,rgba(244,238,242,.92) 30%);
      padding-top:24px;
    }
    .flavor{padding-bottom:0;flex-direction:row;align-items:center;justify-content:space-between;width:100%;gap:12px}
    .tally{justify-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .tally .label{margin-bottom:0}
    .faces{gap:6px;flex-wrap:wrap;justify-content:flex-end}
    .face{width:30px;height:30px;font-size:13px;border-radius:7px}
    .total{font-size:32px;margin-top:-2px}
    .controls{width:100%;gap:8px}
    #roll{width:100%;justify-content:space-between}
    .hint{display:none}
  }
</style>

<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

/* ------------------------------------------------------------------ */
/*  Renderer, scene, camera                                            */
/* ------------------------------------------------------------------ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
const camDir = new THREE.Vector3(0, 1.0, 0.95).normalize();
const camTarget = new THREE.Vector3(0, 0.25, 0);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const portrait = camera.aspect < 1;
  const dist = portrait ? 13 + (1 - camera.aspect) * 18 : 11.5 + Math.max(0, 1.5 - camera.aspect) * 2;
  camTarget.set(0, portrait ? -1.1 : 0.25, 0);      // lift the tray above the bottom bar on phones
  camera.position.copy(camDir).multiplyScalar(dist).add(camTarget);
  camera.lookAt(camTarget);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

/* Environment: a small lit "room" baked to a PMREM so the jelly has
   something to refract and reflect. */
function makeEnvironment() {
  const s = new THREE.Scene();
  const panel = (w, h, d, x, y, z, color, intensity) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial({ color }));
    m.material.color.multiplyScalar(intensity);
    m.position.set(x, y, z);
    s.add(m);
  };
  const room = new THREE.Mesh(new THREE.BoxGeometry(14, 14, 14),
    new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.BackSide }));
  room.material.color.multiplyScalar(0.55);
  s.add(room);
  panel(6, 0.1, 4, 0, 6.9, 0, 0xffffff, 6);      // big soft top light
  panel(0.1, 5, 5, -6.9, 2, 0, 0xffe9f3, 2.2);    // left, warm pink
  panel(0.1, 5, 5, 6.9, 1, -1, 0xeaf2ff, 1.6);    // right, cool
  panel(5, 5, 0.1, 0, 1, -6.9, 0xffd3e8, 1.4);    // back, pink
  panel(3, 3, 0.1, 2, 4, 6.9, 0xffffff, 1.2);     // front-ish rim light
  const pmrem = new THREE.PMREMGenerator(renderer);
  const tex = pmrem.fromScene(s, 0.04).texture;
  pmrem.dispose();
  return tex;
}
scene.environment = makeEnvironment();

const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(4, 9, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -7;
sun.shadow.camera.right = sun.shadow.camera.top = 7;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 30;
sun.shadow.bias = -0.0006;
sun.shadow.radius = 6;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xffffff, 0xffe4f0, 0.6));

/* Tray */
const TRAY_R = 3.9;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(90, 90),
  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, envMapIntensity: 0.55 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
const dish = new THREE.Mesh(new THREE.CircleGeometry(TRAY_R + 0.15, 96),
  new THREE.MeshStandardMaterial({ color: 0xfff1f7, roughness: 1, envMapIntensity: 0.4 }));
dish.rotation.x = -Math.PI / 2; dish.position.y = 0.003; dish.receiveShadow = true;
scene.add(dish);
const rim = new THREE.Mesh(new THREE.RingGeometry(TRAY_R + 0.05, TRAY_R + 0.22, 128),
  new THREE.MeshStandardMaterial({ color: 0xf6c9de, roughness: 1, envMapIntensity: 0.4 }));
rim.rotation.x = -Math.PI / 2; rim.position.y = 0.006;
scene.add(rim);

/* ------------------------------------------------------------------ */
/*  Jelly deformation shader (shared by body, pips and shadow pass)   */
/* ------------------------------------------------------------------ */
const jellyGLSL = /* glsl */`
uniform vec3  uN[2];     // impact normal, local space, pointing into the die
uniform vec3  uTan[2];   // sway direction, local space
uniform float uT[2];     // seconds since impact
uniform float uA[2];     // impact amplitude
uniform vec3  uGrabP;    // where the finger holds the die, local space
uniform vec3  uGrabD;    // how far that point is pulled from the body, local space
uniform float uGrabW;    // 1 while a grab (or its snap-back) is active

vec3 jelly(vec3 p){
  vec3 d = vec3(0.0);
  for(int i = 0; i < 2; i++){
    float t   = uT[i];
    float env = uA[i] * exp(-t * 4.2);
    if(env < 0.0004) continue;
    vec3 n  = uN[i];
    vec3 tn = uTan[i];
    float h = clamp(dot(p, n) + 0.5, 0.0, 1.0);   // 0 at the face that hit, 1 at the far face
    vec3 perp = p - n * dot(p, n);

    float s = env * cos(t * 26.0);                  // main squash / stretch
    d -= n * h * s * 0.9;                           // compress toward the contact face
    float bulge = 0.8 - 1.2 * abs(h - 0.5);        // strongest mid-height, gentle at the faces
    d += perp * s * bulge;

    d += n * env * 0.16 * sin(t * 42.0 - h * 7.0);  // ripple travelling away from the impact
    d += tn * env * 0.5 * sin(t * 19.0 + 0.5) * h * h; // top sways sideways, like set jelly
  }
  if(uGrabW > 0.0){
    float len = length(uGrabD);
    if(len > 0.0001){
      vec3 rel  = p - uGrabP;
      float dist = length(rel);
      float w = exp(-dist * dist * 2.4);            // the held point follows fully, the far side barely
      vec3 dir = uGrabD / len;
      vec3 perp = rel - dir * dot(rel, dir);
      d += uGrabD * w;                              // taffy pull
      d -= perp * len * 0.22 * w * (1.0 - w) * 2.0; // neck thins where it stretches
    }
  }
  return p + d;
}

vec3 jellyNormal(vec3 p, vec3 n){
  vec3 t1 = normalize(cross(n, abs(n.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0)));
  vec3 t2 = cross(n, t1);
  float e = 0.012;
  vec3 dx = jelly(p + t1 * e) - jelly(p - t1 * e);
  vec3 dy = jelly(p + t2 * e) - jelly(p - t2 * e);
  return normalize(cross(dx, dy));
}
`;

function makeJellyUniforms() {
  return {
    uN:   { value: [new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 1, 0)] },
    uTan: { value: [new THREE.Vector3(1, 0, 0), new THREE.Vector3(1, 0, 0)] },
    uT:   { value: [10, 10] },
    uA:   { value: [0, 0] },
    uGrabP: { value: new THREE.Vector3() },
    uGrabD: { value: new THREE.Vector3() },
    uGrabW: { value: 0 },
  };
}

function applyJelly(material, uniforms) {
  material.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, uniforms);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\n' + jellyGLSL)
      .replace('#include <beginnormal_vertex>',
        'vec3 objectNormal = jellyNormal(position, normal);\n#ifdef USE_TANGENT\nvec3 objectTangent = vec3(tangent.xyz);\n#endif')
      .replace('#include <begin_vertex>', 'vec3 transformed = jelly(position);');
  };
  material.customProgramCacheKey = () => 'jelly';
  return material;
}

/* ------------------------------------------------------------------ */
/*  Die geometry: rounded cube + inlaid pips merged into one mesh      */
/* ------------------------------------------------------------------ */
const HALF = 0.5;
const RC = 0.11;             // corner radius
const CC = HALF - RC;        // corner-sphere center offset

function roundedBox(size, radius, seg) {
  const g = new THREE.BoxGeometry(size, size, size, seg, seg, seg);
  const pos = g.attributes.position, nor = g.attributes.normal;
  const half = size / 2, inner = half - radius;
  const p = new THREE.Vector3(), q = new THREE.Vector3(), d = new THREE.Vector3();
  const remap = (v) => Math.abs(v) >= half - 1e-6 ? v : half * Math.sin(v / half * Math.PI / 2); // densify toward edges
  for (let i = 0; i < pos.count; i++) {
    p.fromBufferAttribute(pos, i);
    p.set(remap(p.x), remap(p.y), remap(p.z));
    q.set(THREE.MathUtils.clamp(p.x, -inner, inner),
          THREE.MathUtils.clamp(p.y, -inner, inner),
          THREE.MathUtils.clamp(p.z, -inner, inner));
    d.subVectors(p, q);
    if (d.lengthSq() > 1e-12) {
      d.normalize();
      p.copy(q).addScaledVector(d, radius);
      nor.setXYZ(i, d.x, d.y, d.z);
    }
    pos.setXYZ(i, p.x, p.y, p.z);
  }
  return g;
}

const PIP_LAYOUT = {
  1: [[0, 0]],
  2: [[-1, -1], [1, 1]],
  3: [[-1, -1], [0, 0], [1, 1]],
  4: [[-1, -1], [-1, 1], [1, -1], [1, 1]],
  5: [[-1, -1], [-1, 1], [0, 0], [1, -1], [1, 1]],
  6: [[-1, -1], [-1, 0], [-1, 1], [1, -1], [1, 0], [1, 1]],
};
// Opposite faces add to seven.
const FACES = [
  { n: new THREE.Vector3(0, 0, 1),  u: new THREE.Vector3(1, 0, 0), v: new THREE.Vector3(0, 1, 0), value: 1 },
  { n: new THREE.Vector3(0, 0, -1), u: new THREE.Vector3(1, 0, 0), v: new THREE.Vector3(0, 1, 0), value: 6 },
  { n: new THREE.Vector3(1, 0, 0),  u: new THREE.Vector3(0, 0, 1), v: new THREE.Vector3(0, 1, 0), value: 2 },
  { n: new THREE.Vector3(-1, 0, 0), u: new THREE.Vector3(0, 0, 1), v: new THREE.Vector3(0, 1, 0), value: 5 },
  { n: new THREE.Vector3(0, 1, 0),  u: new THREE.Vector3(1, 0, 0), v: new THREE.Vector3(0, 0, 1), value: 3 },
  { n: new THREE.Vector3(0, -1, 0), u: new THREE.Vector3(1, 0, 0), v: new THREE.Vector3(0, 0, 1), value: 4 },
];

function mergeWithGroups(parts) {
  let vc = 0, ic = 0;
  for (const { geo } of parts) { vc += geo.attributes.position.count; ic += geo.index.count; }
  const pos = new Float32Array(vc * 3), nor = new Float32Array(vc * 3), idx = new Uint32Array(ic);
  const out = new THREE.BufferGeometry();
  let vo = 0, io = 0, groupStart = 0, groupMat = parts[0].mat;
  for (const { geo, mat } of parts) {
    if (mat !== groupMat) { out.addGroup(groupStart, io - groupStart, groupMat); groupStart = io; groupMat = mat; }
    pos.set(geo.attributes.position.array, vo * 3);
    nor.set(geo.attributes.normal.array, vo * 3);
    const gi = geo.index.array;
    for (let i = 0; i < gi.length; i++) idx[io + i] = gi[i] + vo;
    vo += geo.attributes.position.count; io += gi.length;
  }
  out.addGroup(groupStart, io - groupStart, groupMat);
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setIndex(new THREE.BufferAttribute(idx, 1));
  return out;
}

function buildDieGeometry(withCherry) {
  const parts = [{ geo: roundedBox(1, RC, 18), mat: 0 }];
  const m = new THREE.Matrix4();
  for (const f of FACES) {
    for (const [a, b] of PIP_LAYOUT[f.value]) {
      const r = f.value === 1 ? 0.105 : 0.082;
      const pip = new THREE.SphereGeometry(r, 26, 16);
      pip.scale(1, 1, 0.5);                                   // a lens
      m.makeBasis(f.u, new THREE.Vector3().crossVectors(f.n, f.u), f.n);   // right-handed, or the lens is inside-out
      m.setPosition(f.n.clone().multiplyScalar(HALF - 0.024)
        .addScaledVector(f.u, a * 0.27).addScaledVector(f.v, b * 0.27));
      pip.applyMatrix4(m);
      parts.push({ geo: pip, mat: 1 });
    }
  }
  if (withCherry) {
    // a little cherry, sitting just below center, stem curling up toward a corner
    const c = new THREE.Vector3(0.02, -0.1, 0.03);
    const cherry = new THREE.SphereGeometry(0.2, 40, 28);
    cherry.scale(1, 0.9, 1);
    // a dimple where the stem goes in
    const cp = cherry.attributes.position, cn = cherry.attributes.normal;
    for (let i = 0; i < cp.count; i++) {
      const y = cp.getY(i), x = cp.getX(i), z = cp.getZ(i);
      const rxz = Math.hypot(x, z);
      if (y > 0 && rxz < 0.085) { const k = 1 - rxz / 0.085; cp.setY(i, y - 0.06 * k * k); }
    }
    cherry.computeVertexNormals();
    cherry.translate(c.x, c.y, c.z);
    parts.push({ geo: cherry, mat: 2 });
    const stemCurve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(c.x, c.y + 0.13, c.z),
      new THREE.Vector3(c.x + 0.04, c.y + 0.42, c.z - 0.01),
      new THREE.Vector3(c.x + 0.2, c.y + 0.5, c.z - 0.14));
    const stem = new THREE.TubeGeometry(stemCurve, 24, 0.018, 10, false);
    parts.push({ geo: stem, mat: 3 });
    const knot = new THREE.SphereGeometry(0.028, 12, 8);
    knot.translate(c.x + 0.2, c.y + 0.5, c.z - 0.14);
    parts.push({ geo: knot, mat: 3 });
  }
  return mergeWithGroups(parts);
}

let currentFlavor = 'strawberry';

function makeMaterials(uniforms, flavor) {
  const f = FLAVORS[flavor];
  const body = applyJelly(new THREE.MeshPhysicalMaterial({
    color: f.body.color,
    transmission: f.body.transmission, thickness: f.body.thickness ?? 1.35, ior: f.body.ior ?? 1.42,
    attenuationColor: new THREE.Color(f.body.attenuationColor), attenuationDistance: f.body.attenuationDistance,
    roughness: f.body.roughness, metalness: f.body.metalness ?? 0,
    clearcoat: f.body.clearcoat ?? 0.55, clearcoatRoughness: f.body.clearcoatRoughness ?? 0.18,
    specularIntensity: f.body.specularIntensity ?? 1, envMapIntensity: f.body.envMapIntensity ?? 1.25,
  }), uniforms);
  const pips = applyJelly(new THREE.MeshPhysicalMaterial({
    color: f.pips?.color ?? 0xffffff, roughness: f.pips?.roughness ?? 0.32, metalness: f.pips?.metalness ?? 0,
    clearcoat: 0.3, envMapIntensity: f.pips?.metalness ? 1.4 : 0.8,
  }), uniforms);
  const list = [body, pips];
  if (flavor === 'cherry') {
    list.push(applyJelly(new THREE.MeshPhysicalMaterial({
      color: 0x8c0a1e, roughness: 0.16, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.04, envMapIntensity: 1.2,
    }), uniforms));
    list.push(applyJelly(new THREE.MeshStandardMaterial({ color: 0x5a3a12, roughness: 0.7, envMapIntensity: 0.5 }), uniforms));
  }
  const depth = applyJelly(new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking }), uniforms);
  return { list, depth };
}

/* ------------------------------------------------------------------ */
/*  Dice sounds — short plastic clacks, unlocked on the first gesture  */
/* ------------------------------------------------------------------ */
const DiceSound = (() => {
  let ctx = null, noiseBuf = null, lastT = 0;
  function unlock() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!ctx) ctx = new AC();
    if (ctx.state === 'suspended') ctx.resume();
  }
  function noise() {
    if (noiseBuf) return noiseBuf;
    const n = Math.floor(ctx.sampleRate * 0.18);
    const b = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return (noiseBuf = b);
  }
  function clack(strength) {
    if (!ctx) return;
    const now = ctx.currentTime;
    const s = Math.min(1, Math.max(0.12, strength));
    if (now - lastT < 0.042 && s < 0.65) return;
    lastT = now;
    const src = ctx.createBufferSource();
    src.buffer = noise();
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 780 + s * 1100 + Math.random() * 280;
    bp.Q.value = 1.8;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(0.2 * s, now + 0.001);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.035 + s * 0.045);
    src.connect(bp); bp.connect(g); g.connect(ctx.destination);
    src.start(now); src.stop(now + 0.12);
    const o = ctx.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(160 + s * 90 + Math.random() * 30, now);
    o.frequency.exponentialRampToValueAtTime(70, now + 0.055);
    const og = ctx.createGain();
    og.gain.setValueAtTime(0.1 * s, now);
    og.gain.exponentialRampToValueAtTime(0.0001, now + 0.065);
    o.connect(og); og.connect(ctx.destination);
    o.start(now); o.stop(now + 0.08);
  }
  function toss() {
    if (!ctx) return;
    for (let i = 0; i < 4; i++) setTimeout(() => clack(0.28 + Math.random() * 0.25), i * 32);
  }
  return { unlock, clack, toss };
})();
addEventListener('pointerdown', () => DiceSound.unlock(), { passive: true });

/* ------------------------------------------------------------------ */
/*  Physics                                                            */
/* ------------------------------------------------------------------ */
const G = 30;
const DT = 1 / 240;
const INV_M = 1;
const INV_I = 6;             // cube: I = m s² / 6, isotropic, so one scalar does it
const REST_FLOOR = 0.42, REST_WALL = 0.38, REST_DIE = 0.42;
const MU_FLOOR = 0.55, MU_WALL = 0.4, MU_DIE = 0.35;
const DIE_SPHERE = 0.62;     // die-to-die approximation radius

const CORNERS = [];
for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1])
  CORNERS.push(new THREE.Vector3(sx * CC, sy * CC, sz * CC));

const _v = new THREE.Vector3(), _w = new THREE.Vector3(), _rn = new THREE.Vector3(), _vt = new THREE.Vector3(),
      _rt = new THREE.Vector3(), _cw = new THREE.Vector3(), _rw = new THREE.Vector3(), _n = new THREE.Vector3(),
      _dq = new THREE.Quaternion(), _invQ = new THREE.Quaternion(), _tmp = new THREE.Vector3();

class Die {
  constructor() {
    this.pos = new THREE.Vector3(); this.vel = new THREE.Vector3();
    this.quat = new THREE.Quaternion(); this.ang = new THREE.Vector3();
    this.resting = false; this.settling = false; this.lowEnergy = 0; this.floorContacts = 0;
    this.targetQuat = new THREE.Quaternion();
    this.grabbed = false;
    this.stretch = new THREE.Vector3(); this.stretchVel = new THREE.Vector3();
    this.uniforms = makeJellyUniforms();
    this.mesh = new THREE.Mesh(FLAVORS[currentFlavor].geometry, []);
    this.mesh.castShadow = true;
    this.mesh.userData.die = this;
    this.setFlavor(currentFlavor);
  }
  setFlavor(flavor) {
    this.mesh.material.forEach(m => m.dispose());
    if (this.mesh.customDepthMaterial) this.mesh.customDepthMaterial.dispose();
    const mats = makeMaterials(this.uniforms, flavor);
    this.mesh.geometry = FLAVORS[flavor].geometry;
    this.mesh.material = mats.list;
    this.mesh.customDepthMaterial = mats.depth;
  }
  sync() {
    this.mesh.position.copy(this.pos);
    this.mesh.quaternion.copy(this.quat);
  }
  upValue() {
    let best = -2, value = 0;
    for (const f of FACES) {
      const y = _tmp.copy(f.n).applyQuaternion(this.quat).y;
      if (y > best) { best = y; value = f.value; }
    }
    return value;
  }
  // Rotation that flattens the current up-face onto +Y while keeping the yaw the die already has.
  computeSettleTarget() {
    let best = -2, up = null;
    for (const f of FACES) {
      const y = _tmp.copy(f.n).applyQuaternion(this.quat).y;
      if (y > best) { best = y; up = f.n; }
    }
    const upWorld = _v.copy(up).applyQuaternion(this.quat).normalize();
    _dq.setFromUnitVectors(upWorld, new THREE.Vector3(0, 1, 0));
    this.targetQuat.copy(_dq).multiply(this.quat).normalize();
  }
  wobble(nWorld, tWorld, amp) {
    const u = this.uniforms;
    let slot = 0, weakest = Infinity;
    for (let i = 0; i < 2; i++) {
      const env = u.uA.value[i] * Math.exp(-u.uT.value[i] * 4.2);
      if (env < weakest) { weakest = env; slot = i; }
    }
    if (amp < weakest * 0.75) return;
    _invQ.copy(this.quat).invert();
    u.uN.value[slot].copy(nWorld).applyQuaternion(_invQ).normalize();
    u.uTan.value[slot].copy(tWorld).applyQuaternion(_invQ).normalize();
    u.uT.value[slot] = 0;
    u.uA.value[slot] = amp;
  }
  wake() { this.resting = false; this.settling = false; this.lowEnergy = 0; }
}

function randomPerp(n, out) {
  out.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5);
  out.addScaledVector(n, -out.dot(n));
  if (out.lengthSq() < 1e-6) out.set(1, 0, 0).addScaledVector(n, -n.x);
  return out.normalize();
}

/* Contact between a die and a fixed surface.
   rw: world offset from the die center to the contact point.
   n: surface normal pointing into the die. */
function surfaceContact(d, rw, n, pen, rest, mu) {
  if (pen > 0) d.pos.addScaledVector(n, pen * 0.6);
  _v.crossVectors(d.ang, rw).add(d.vel);           // point velocity
  const vn = _v.dot(n);
  if (vn >= 0) return 0;
  _rn.crossVectors(rw, n);
  const k = INV_M + INV_I * _rn.lengthSq();
  const e = vn < -1.2 ? rest : 0;
  const j = -(1 + e) * vn / k;
  d.vel.addScaledVector(n, j * INV_M);
  d.ang.addScaledVector(_rn, j * INV_I);

  // friction
  _v.crossVectors(d.ang, rw).add(d.vel);
  _vt.copy(_v).addScaledVector(n, -_v.dot(n));
  const vtLen = _vt.length();
  if (vtLen > 1e-4) {
    _vt.multiplyScalar(-1 / vtLen);
    _rt.crossVectors(rw, _vt);
    const kt = INV_M + INV_I * _rt.lengthSq();
    const jt = Math.min(vtLen / kt, mu * j);
    d.vel.addScaledVector(_vt, jt * INV_M);
    d.ang.addScaledVector(_rt, jt * INV_I);
  }
  if (j > 0.35) {
    const amp = Math.min(0.3, 0.06 + j * 0.045);
    const tan = vtLen > 0.3 ? _vt.clone().multiplyScalar(-1) : randomPerp(n, new THREE.Vector3());
    d.wobble(n, tan, amp);
    DiceSound.clack(Math.min(1, (j - 0.2) / 2.2));
  }
  return j;
}

function dieDieContact(a, b) {
  _n.subVectors(b.pos, a.pos);
  const dist = _n.length();
  const pen = 2 * DIE_SPHERE - dist;
  if (pen <= 0 || dist < 1e-6) return;
  _n.multiplyScalar(1 / dist);
  a.pos.addScaledVector(_n, -pen * 0.5);
  b.pos.addScaledVector(_n, pen * 0.5);
  if (pen > 0.02) { a.wake(); b.wake(); }
  const ra = _tmp.copy(_n).multiplyScalar(DIE_SPHERE);
  const rb = _rw.copy(_n).multiplyScalar(-DIE_SPHERE);
  _v.crossVectors(b.ang, rb).add(b.vel).sub(_w.crossVectors(a.ang, ra).add(a.vel)); // relative velocity at contact
  const vn = _v.dot(_n);
  if (vn >= 0) return;
  const e = vn < -1.2 ? REST_DIE : 0;
  const j = -(1 + e) * vn / (2 * INV_M);
  a.vel.addScaledVector(_n, -j * INV_M);
  b.vel.addScaledVector(_n, j * INV_M);
  // friction gives them spin off each other
  _vt.copy(_v).addScaledVector(_n, -vn);
  const vtLen = _vt.length();
  if (vtLen > 1e-4) {
    _vt.multiplyScalar(-1 / vtLen);
    const rta = _rn.crossVectors(ra, _vt).clone(), rtb = _rt.crossVectors(rb, _vt);
    const kt = 2 * INV_M + INV_I * (rta.lengthSq() + rtb.lengthSq());
    const jt = Math.min(vtLen / kt, MU_DIE * j);
    a.vel.addScaledVector(_vt, -jt * INV_M); a.ang.addScaledVector(rta, -jt * INV_I);
    b.vel.addScaledVector(_vt, jt * INV_M);  b.ang.addScaledVector(rtb, jt * INV_I);
  }
  if (j > 0.35) {
    const amp = Math.min(0.3, 0.06 + j * 0.045);
    a.wobble(_tmp.copy(_n).negate(), randomPerp(_n, new THREE.Vector3()), amp);
    b.wobble(_n, randomPerp(_n, new THREE.Vector3()), amp);
    DiceSound.clack(Math.min(1, (j - 0.2) / 2.2));
  }
}

const GRAB_K = 80, GRAB_C = 9, GRAB_BREAK = 1.25;
function grabStep(d, dt) {
  _rw.copy(grab.local).applyQuaternion(d.quat);       // held point, offset from center
  _cw.copy(d.pos).add(_rw);                            // held point, world
  _v.subVectors(grab.target, _cw);                    // how far the finger is from the body
  if (_v.length() > GRAB_BREAK) { releaseGrab(true); return; }
  _w.crossVectors(d.ang, _rw).add(d.vel);             // velocity of the held point
  _v.multiplyScalar(GRAB_K).addScaledVector(_w, -GRAB_C);  // spring + damper = force
  d.vel.addScaledVector(_v, INV_M * dt);
  d.ang.addScaledVector(_rn.crossVectors(_rw, _v), INV_I * dt);
  d.ang.multiplyScalar(1 - 3 * dt);
}

function physicsStep(dt) {
  for (const d of dice) {
    if (d.resting) continue;
    if (d.grabbed) grabStep(d, dt);
    d.vel.y -= G * dt;
    d.vel.multiplyScalar(1 - 0.03 * dt);
    d.ang.multiplyScalar(1 - 0.08 * dt);
    d.pos.addScaledVector(d.vel, dt);
    const angle = d.ang.length() * dt;
    if (angle > 0) {
      _dq.setFromAxisAngle(_tmp.copy(d.ang).normalize(), angle);
      d.quat.premultiply(_dq).normalize();
    }
    d.floorContacts = 0;
  }
  for (let iter = 0; iter < 3; iter++) {
    for (const d of dice) {
      if (d.resting) continue;
      for (const c of CORNERS) {
        _cw.copy(c).applyQuaternion(d.quat);          // corner-sphere center, relative to die
        // floor
        const cy = d.pos.y + _cw.y;
        const penF = RC - cy;
        if (penF > 0) {
          _n.set(0, 1, 0);
          _rw.copy(_cw).addScaledVector(_n, -RC);
          surfaceContact(d, _rw, _n, penF, REST_FLOOR, MU_FLOOR);
          if (iter === 0) d.floorContacts++;
        }
        // tray wall (a cylinder)
        const cx = d.pos.x + _cw.x, cz = d.pos.z + _cw.z;
        const r = Math.hypot(cx, cz);
        const penW = r + RC - TRAY_R;
        if (penW > 0 && r > 1e-6) {
          _n.set(-cx / r, 0, -cz / r);
          _rw.copy(_cw).addScaledVector(_n, -RC);
          surfaceContact(d, _rw, _n, penW, REST_WALL, MU_WALL);
        }
      }
    }
    for (let i = 0; i < dice.length; i++)
      for (let j = i + 1; j < dice.length; j++)
        if (!(dice[i].resting && dice[j].resting)) dieDieContact(dice[i], dice[j]);
  }
  // rolling resistance when touching the floor
  for (const d of dice) {
    if (d.resting || d.floorContacts === 0) continue;
    d.ang.multiplyScalar(1 - 3.5 * dt);
    d.vel.x *= 1 - 2 * dt; d.vel.z *= 1 - 2 * dt;
  }
}

function settleStep(dt) {
  let allResting = true;
  for (const d of dice) {
    if (d.resting) continue;
    allResting = false;
    if (d.grabbed) continue;
    const speed = d.vel.length(), spin = d.ang.length();
    if (!d.settling) {
      if (speed < 0.45 && spin < 1.0 && d.pos.y < 0.95) d.lowEnergy += dt; else d.lowEnergy = 0;
      if (d.lowEnergy > 0.22 || rollClock > 9) { d.settling = true; d.computeSettleTarget(); }
    }
    if (d.settling) {
      d.quat.slerp(d.targetQuat, Math.min(1, 10 * dt));
      d.pos.y += (HALF - d.pos.y) * Math.min(1, 10 * dt);
      d.vel.multiplyScalar(1 - 8 * dt); d.ang.multiplyScalar(1 - 12 * dt);
      if (d.quat.angleTo(d.targetQuat) < 0.01 && Math.abs(d.pos.y - HALF) < 0.005) {
        d.quat.copy(d.targetQuat); d.pos.y = HALF; d.vel.set(0, 0, 0); d.ang.set(0, 0, 0);
        d.resting = true; d.settling = false;
      }
    }
  }
  return allResting;
}

/* ------------------------------------------------------------------ */
/*  Dice management, rolling, results                                  */
/* ------------------------------------------------------------------ */
let dice = [];
let rolling = false, rollClock = 0;
const eyebrowEl = document.getElementById('eyebrow');
const facesEl = document.getElementById('faces');

function renderFaces(values, waiting) {
  const boxes = values.map(v => `<div class="face${waiting ? ' wait' : ''}">${waiting ? '·' : v}</div>`).join('');
  const total = waiting ? '•••' : values.reduce((a, b) => a + b, 0);
  facesEl.innerHTML = `${boxes}<span class="eq">=</span><div class="total${waiting ? ' wait' : ''}">${total}</div>`;
}
function showRolling() {
  eyebrowEl.textContent = 'A little suspense…';
  renderFaces(dice.map(() => 0), true);
}

function setDiceCount(n) {
  for (const d of dice) { scene.remove(d.mesh); d.mesh.material.forEach(m => m.dispose()); d.mesh.customDepthMaterial.dispose(); }
  dice = [];
  for (let i = 0; i < n; i++) { const d = new Die(); dice.push(d); scene.add(d.mesh); }
}

function placeAtRest() {
  const n = dice.length;
  dice.forEach((d, i) => {
    const a = (i / n) * Math.PI * 2 + 0.6;
    const r = n === 1 ? 0 : 0.95 + n * 0.08;
    d.pos.set(Math.cos(a) * r, HALF, Math.sin(a) * r);
    d.quat.setFromEuler(new THREE.Euler(0, Math.random() * Math.PI * 2, 0));
    // pick a random face up
    const f = FACES[Math.floor(Math.random() * 6)];
    _dq.setFromUnitVectors(f.n, new THREE.Vector3(0, 1, 0));
    d.quat.multiply(_dq).normalize();
    d.vel.set(0, 0, 0); d.ang.set(0, 0, 0);
    d.resting = true; d.settling = false;
    d.sync();
  });
  showResult();
}

function roll() {
  rolling = true; rollClock = 0;
  DiceSound.unlock();
  DiceSound.toss();
  showRolling();
  const n = dice.length;
  const base = Math.random() * Math.PI * 2;
  dice.forEach((d, i) => {
    d.wake();
    const a = base + (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.8;
    const r = 2.0 + Math.random() * 1.1;
    d.pos.set(Math.cos(a) * r, 3.2 + i * 0.7 + Math.random() * 0.8, Math.sin(a) * r);
    d.quat.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
    d.vel.set(-Math.cos(a) * (3 + Math.random() * 3) + (Math.random() - 0.5) * 2,
              -1.5 + Math.random() * 2.5,
              -Math.sin(a) * (3 + Math.random() * 3) + (Math.random() - 0.5) * 2);
    d.ang.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize()
      .multiplyScalar(11 + Math.random() * 10);
    // they jiggle from the throw itself
    d.wobble(new THREE.Vector3(0, 1, 0), randomPerp(new THREE.Vector3(0, 1, 0), new THREE.Vector3()), 0.14);
  });
}

function showResult() {
  eyebrowEl.textContent = 'On the table';
  renderFaces(dice.map(d => d.upValue()), false);
}

/* Touching, pulling and letting go */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const grab = {
  die: null, local: new THREE.Vector3(), target: new THREE.Vector3(),
  plane: new THREE.Plane(), pointerId: null, t0: 0, x0: 0, y0: 0, moved: false,
};
const STRETCH_MAX = 1.1, SNAP_K = 420, SNAP_C = 9;

function pointerRay(ev) {
  pointer.set((ev.clientX / innerWidth) * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
}

canvas.addEventListener('pointerdown', (ev) => {
  if (grab.die) return;
  pointerRay(ev);
  const hit = raycaster.intersectObjects(dice.map(d => d.mesh), false)[0];
  if (!hit) return;
  const d = hit.object.userData.die;
  d.wake(); d.grabbed = true;
  grab.die = d; grab.pointerId = ev.pointerId;
  grab.local.copy(hit.point); d.mesh.worldToLocal(grab.local);
  grab.target.copy(hit.point);
  grab.plane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(_tmp).negate(), hit.point);
  grab.t0 = performance.now(); grab.x0 = ev.clientX; grab.y0 = ev.clientY; grab.moved = false;
  d.uniforms.uGrabP.value.copy(grab.local);
  d.uniforms.uGrabW.value = 1;
  d.stretch.set(0, 0, 0); d.stretchVel.set(0, 0, 0);
  // a fingertip dent
  const dir = raycaster.ray.direction.clone();
  d.wobble(dir, randomPerp(dir, new THREE.Vector3()), 0.13);
  DiceSound.clack(0.28);
  canvas.setPointerCapture(ev.pointerId);
  if (!rolling) { rolling = true; rollClock = 0; showRolling(); }
});

canvas.addEventListener('pointermove', (ev) => {
  if (!grab.die || ev.pointerId !== grab.pointerId) return;
  if (Math.hypot(ev.clientX - grab.x0, ev.clientY - grab.y0) > 8) grab.moved = true;
  pointerRay(ev);
  if (raycaster.ray.intersectPlane(grab.plane, _tmp)) {
    // keep the target inside the tray and above the table
    const r = Math.hypot(_tmp.x, _tmp.z), maxR = TRAY_R - 0.7;
    if (r > maxR) { _tmp.x *= maxR / r; _tmp.z *= maxR / r; }
    _tmp.y = THREE.MathUtils.clamp(_tmp.y, 0.2, 4.5);
    grab.target.copy(_tmp);
  }
});

function releaseGrab(torn) {
  const d = grab.die; if (!d) return;
  d.grabbed = false; grab.die = null;
  try { canvas.releasePointerCapture(grab.pointerId); } catch (e) {}
  rollClock = 0;
  const len = d.stretch.length();
  if (len > 0.02) {
    // the pulled part rushes back into the body
    const back = d.stretch.clone().negate().normalize().applyQuaternion(d.quat);
    d.wobble(back, randomPerp(back, new THREE.Vector3()), Math.min(0.3, 0.08 + len * 0.25));
  }
  if (torn) {
    // it lets go with a snap: a flick away from the finger
    const dir = d.stretch.clone().normalize().applyQuaternion(d.quat);
    d.vel.addScaledVector(dir, -2.5);
    d.vel.y += 1.5;
  } else if (!grab.moved && performance.now() - grab.t0 < 220) {
    // a quick tap: a poke
    pointerRay({ clientX: grab.x0, clientY: grab.y0 });
    const dir = raycaster.ray.direction.clone();
    const rw = grab.local.clone().applyQuaternion(d.quat);
    d.vel.addScaledVector(dir, 3.2 * INV_M); d.vel.y += 1.5;
    d.ang.addScaledVector(_rn.crossVectors(rw, dir), 3.2 * INV_I);
  }
  d.stretchVel.set(0, 0, 0); // the stretch now springs back on its own
}
canvas.addEventListener('pointerup', (ev) => { if (grab.die && ev.pointerId === grab.pointerId) releaseGrab(false); });
canvas.addEventListener('pointercancel', () => releaseGrab(false));
addEventListener('blur', () => releaseGrab(false));

/* Per-frame stretch: follows the finger while held, springs home after. */
function updateStretch(d, dt) {
  const u = d.uniforms;
  if (d.grabbed && grab.die === d) {
    _rw.copy(grab.local).applyQuaternion(d.quat).add(d.pos);
    _invQ.copy(d.quat).invert();
    d.stretch.subVectors(grab.target, _rw).applyQuaternion(_invQ);
    if (d.stretch.length() > STRETCH_MAX) d.stretch.setLength(STRETCH_MAX);
    d.stretchVel.set(0, 0, 0);
  } else if (u.uGrabW.value > 0) {
    d.stretchVel.addScaledVector(d.stretch, -SNAP_K * dt).multiplyScalar(Math.max(0, 1 - SNAP_C * dt));
    d.stretch.addScaledVector(d.stretchVel, dt);
    if (d.stretch.lengthSq() < 1e-6 && d.stretchVel.lengthSq() < 1e-4) {
      d.stretch.set(0, 0, 0); u.uGrabW.value = 0;
    }
  }
  u.uGrabD.value.copy(d.stretch);
}

/* UI */
document.getElementById('roll').addEventListener('click', roll);
document.getElementById('flavor').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.dataset.flavor === currentFlavor) return;
  currentFlavor = b.dataset.flavor;
  document.querySelectorAll('#flavor button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  document.getElementById('flavorName').textContent = FLAVORS[currentFlavor].label;
  for (const d of dice) {
    d.setFlavor(currentFlavor);
    // a little shiver as the jelly changes
    const n = new THREE.Vector3(0, 1, 0);
    d.wobble(n, randomPerp(n, new THREE.Vector3()), 0.12);
  }
});
document.getElementById('count').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  document.querySelectorAll('#count button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  setDiceCount(+b.dataset.n);
  roll();
});
addEventListener('keydown', (ev) => { if (ev.code === 'Space' && ev.target === document.body) { ev.preventDefault(); roll(); } });

/* ------------------------------------------------------------------ */
/*  Main loop                                                          */
/* ------------------------------------------------------------------ */
setDiceCount(3);
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reducedMotion) placeAtRest(); else roll();

const clock = new THREE.Clock();
let acc = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  acc += dt;
  while (acc >= DT) { physicsStep(DT); acc -= DT; }
  if (rolling) {
    rollClock += dt;
    if (settleStep(dt)) { rolling = false; showResult(); }
  }
  for (const d of dice) {
    updateStretch(d, dt);
    d.uniforms.uT.value[0] = Math.min(20, d.uniforms.uT.value[0] + dt);
    d.uniforms.uT.value[1] = Math.min(20, d.uniforms.uT.value[1] + dt);
    d.sync();
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
</script>
